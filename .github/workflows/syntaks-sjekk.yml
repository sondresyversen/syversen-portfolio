name: HTML og CSS Syntaks-sjekk

on:
  pull_request:
    branches:
      - qa
      - main

jobs:
  sjekk-kode:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sjekk HTML-syntaks
        run: npx htmlhint "**/*.html"

      - name: Sjekk CSS-syntaks
        run: npx stylelint "**/*.css" --allow-empty-input --rules '{"block-no-empty": true, "color-no-invalid-hex": true, "declaration-block-no-duplicate-properties": true, "property-no-unknown": true, "selector-type-no-unknown": true, "string-no-newline": true}'
