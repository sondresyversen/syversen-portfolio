name: HTML og CSS Syntaks-sjekk

on:
  pull_request:
    branches:
      - qa
      - main

jobs:
  sjekk-kode:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sjekk HTML-syntaks
        run: npx htmlhint "**/*.html"

      - name: Sjekk CSS-syntaks
        run: npx csstree-validator .

